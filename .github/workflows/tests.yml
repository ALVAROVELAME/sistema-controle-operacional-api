name: Testes automatizados

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar dependencias
        run: dotnet restore SistemaControleOperacional.sln
      - name: Compilar
        run: dotnet build SistemaControleOperacional.sln -c Release --no-restore
      - name: Testar e coletar cobertura
        run: dotnet test SistemaControleOperacional.sln -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: TestResults/
