services:

  sistema_controle_operacional_api:

    build: .

    container_name: sistema_controle_operacional_api

    ports:
      - "127.0.0.1:3001:8080"

    env_file:
      - .env

    restart: unless-stopped

    mem_limit: 350m
    cpus: "0.50"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"